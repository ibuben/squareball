#     enabled: true
#     secret_file: /etc/webmail/panel-sso.key
#     domains: [example.com]
#     api:
#       token_file: /etc/webmail/panel-api.token

# Брендинг: название, логотип, favicon и цвет акцента. Картинка — ссылкой (*_url)
# или файлом (*_file: svg/png/jpg/webp/gif/ico до 1 МиБ, сервер раздаёт его сам).
# accent — основной цвет; оттенки выделения и цвет текста на кнопках считаются из него.
# accent_dark — цвет для тёмной темы (по умолчанию — посветлевший accent).
# css_vars — тонкая настройка любых CSS-переменных из web/src/styles.css, поверх расчёта.
# hide_about: true — убрать кнопку и окно «О программе».
# Язык интерфейса: default_language — для тех, кто ещё не выбрал язык сам (на экране
# входа или в настройках); languages — какие языки предлагать (есть en и ru).
# theme — тема по умолчанию: light, dark или system.
# ui:
#   default_language: en
#   languages: [en, ru]
#   theme: system
#   brand:
#     name: "Почта"
#     logo_file: /etc/webmail/brand/logo.svg
#     logo_dark_file: /etc/webmail/brand/logo-dark.svg   # для тёмной темы
#     favicon_file: /etc/webmail/brand/favicon.png
#     accent: "#0b7a5c"
#     accent_dark: "#3fb68f"
#     css_vars: { "--radius": "6px" }
#     hide_about: false

# Проверка орфографии в редакторе: browser (по умолчанию) — средствами браузера;
# hunspell — на сервере (apt install hunspell hunspell-ru hunspell-en-us),
# с выбором словаря и личным словарём пользователя; off — выключена.
# spellcheck:
#   engine: hunspell
#   hunspell:
#     dictionaries: [ru_RU, en_US]

# Внешние адресные книги CardDAV (Nextcloud, SOGo, Radicale, Baïkal, iCloud).
# Контакты кэшируются в БД и правятся в обе стороны; группы — локальные.
# adapters:
#   carddav:
#     enabled: true
#     allow_user_accounts: true       # пользователь подключает свои серверы (пароль хранится зашифрованным)
#     allow_private_networks: false   # пользовательские учётки не ходят во внутренние сети
#     presets:                        # книги для всех ящиков (пароль ящика не хранится)
#       - id: cloud
#         name: Контакты
#         url: https://cloud.example.com/remote.php/dav/addressbooks/users/%u/
#         username: "%u"              # %u — ящик, %l — имя до @, %d — домен
#         password: session           # или password_file: /etc/webmail/carddav.pass
#                                     # при входе из панели session работает только для url на 127.0.0.1/localhost/::1
#                                     # (подставляется мастер-пароль IMAP), см. docs/integration.md
#         readonly: false
#         domains: []                 # пусто — все домены

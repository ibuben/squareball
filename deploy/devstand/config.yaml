# Конфиг для локального стенда (deploy/devstand/setup-debian.sh).
version: 1
server:
  listen: "127.0.0.1:8080"
  public_url: http://127.0.0.1:8080
session:
  secret_file: ./deploy/devstand/session.key
imap:
  host: 127.0.0.1
  port: 993
  security: tls
  tls_verify: false        # самоподписанный сертификат стенда
  impersonation:           # вход из панели (adapters.panel) мастер-учёткой Dovecot
    enabled: true
    master_user: webmail-master
    master_password_file: ./deploy/devstand/master.key
    allowed_sources: [panel]
    apply_to: [smtp, sieve]
smtp:
  host: 127.0.0.1
  port: 587
  security: starttls
  tls_verify: false
login:
  default_domain: test.local
log:
  format: text
  level: debug
sieve:
  enabled: true
  host: 127.0.0.1
  port: 4190
  security: starttls
  tls_verify: false
spellcheck:
  engine: hunspell
  hunspell:
    dictionaries: [ru_RU, en_US, uz_UZ]
adapters:
  carddav:
    enabled: true
    allow_user_accounts: true
    allow_private_networks: true   # стенд: Radicale на 127.0.0.1
    presets:
      - id: stand
        name: Radicale стенда
        url: http://127.0.0.1:5232/%l/
        username: "%l"
        password: session
  panel:
    enabled: true
    secret_file: ./deploy/devstand/panel-sso.key
    domains: [test.local]
    api:
      token_file: ./deploy/devstand/panel-api.token
